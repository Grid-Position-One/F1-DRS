<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101820">
  <title>Support F1-DRS</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 28px 18px; display: grid; place-items: center; background: radial-gradient(circle at 50% 0, #26394a, #101820 65%); color: #f5f7fa; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
    main { width: min(100%, 480px); padding: 34px 26px; text-align: center; background: #182633; border: 1px solid #35495a; border-radius: 22px; box-shadow: 0 22px 70px #0006; }
    .brand { color: #ff4b4b; font-size: 13px; font-weight: 800; letter-spacing: .28em; }
    h1 { margin: 18px 0 10px; font-size: clamp(28px, 7vw, 38px); }
    p { color: #c1ccd5; line-height: 1.7; }
    .qr-wrap { margin: 26px auto 18px; width: min(280px, 100%); padding: 12px; border-radius: 16px; background: white; }
    .qr-wrap img { display: block; width: 100%; height: auto; }
    .hint { font-size: 13px; color: #9eacb9; }
    a { color: #ff7777; }
    footer { margin-top: 28px; color: #8796a4; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <div class="brand">F1 · DRS</div>
    <h1>Support F1-DRS ❤️</h1>
    <p>Thanks for supporting F1-DRS. Your contribution helps support the continued development and maintenance of this project.</p>
    <div class="qr-wrap">
      <img src="./assets/wechat-pay.jpg" alt="WeChat Pay donation QR code">
    </div>
    <h2>WeChat Pay</h2>
    <p class="hint">Scan the QR code with WeChat to support the project.</p>
    <footer>Thank you for being part of the F1-DRS community.<br><a href="https://github.com/Grid-Position-One/F1-DRS">Back to the GitHub repository</a></footer>
  </main>
</body>
</html>
